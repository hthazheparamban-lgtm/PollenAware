services:
  postgres-user:
    image: postgres:17
    container_name: pollenaware-user-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pollenaware_users
      POSTGRES_USER: pollenaware
      POSTGRES_PASSWORD: pollenaware_dev
    volumes:
      - user_postgres_data:/var/lib/postgresql/data

  postgres-auth:
    image: postgres:17
    container_name: pollenaware-auth-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: pollenaware_auth
      POSTGRES_USER: pollenaware
      POSTGRES_PASSWORD: pollenaware_dev
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

  postgres-environmental:
    image: postgres:17
    container_name: pollenaware-environmental-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: pollenaware_environmental
      POSTGRES_USER: pollenaware
      POSTGRES_PASSWORD: pollenaware_dev
    volumes:
      - environmental_postgres_data:/var/lib/postgresql/data

  postgres-risk:
    image: postgres:17
    container_name: pollenaware-risk-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: pollenaware_risk
      POSTGRES_USER: pollenaware
      POSTGRES_PASSWORD: pollenaware_dev
    volumes:
      - risk_postgres_data:/var/lib/postgresql/data

  postgres-notification:
    image: postgres:17
    container_name: pollenaware-notification-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: pollenaware_notifications
      POSTGRES_USER: pollenaware
      POSTGRES_PASSWORD: pollenaware_dev
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
      - ./services/notification-service/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  rabbitmq:
    image: rabbitmq:4-management
    container_name: pollenaware-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: pollenaware
      RABBITMQ_DEFAULT_PASS: pollenaware
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: ./services/auth-service
    container_name: pollenaware-auth-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_NAME: pollenaware_auth
      DB_USER: pollenaware
      DB_PASSWORD: pollenaware_dev
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres-auth

  user-service:
    build:
      context: ./services/user-service
    container_name: pollenaware-user-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://pollenaware:pollenaware_dev@postgres-user:5432/pollenaware_users
      RABBITMQ_URL: amqp://pollenaware:pollenaware@rabbitmq:5672
    depends_on:
      postgres-user:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  environmental-service:
    build:
      context: ./services/environmental-service
    container_name: pollenaware-environmental-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: postgres-environmental
      DB_PORT: 5432
      DB_NAME: pollenaware_environmental
      DB_USER: pollenaware
      DB_PASSWORD: pollenaware_dev
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      RABBITMQ_URL: amqp://pollenaware:pollenaware@rabbitmq:5672
    depends_on:
      postgres-environmental:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: ./services/notification-service
    container_name: pollenaware-notification-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DB_HOST: postgres-notification
      DB_PORT: 5432
      DB_NAME: pollenaware_notifications
      DB_USER: pollenaware
      DB_PASSWORD: pollenaware_dev
      RABBITMQ_URL: amqp://pollenaware:pollenaware@rabbitmq:5672
      USER_SERVICE_URL: http://user-service:3001
    depends_on:
      postgres-notification:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started

  risk-assessment-service:
    build:
      context: ./services/risk-assessment-service
    container_name: pollenaware-risk-assessment-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: postgres-risk
      DB_PORT: 5432
      DB_NAME: pollenaware_risk
      DB_USER: pollenaware
      DB_PASSWORD: pollenaware_dev
      RABBITMQ_URL: amqp://pollenaware:pollenaware@rabbitmq:5672
      USER_SERVICE_URL: http://user-service:3001
      ENVIRONMENTAL_SERVICE_URL: http://environmental-service:3003
    depends_on:
      postgres-risk:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
      environmental-service:
        condition: service_started

volumes:
  user_postgres_data:
  auth_postgres_data:
  environmental_postgres_data:
  risk_postgres_data:
  notification_postgres_data:
